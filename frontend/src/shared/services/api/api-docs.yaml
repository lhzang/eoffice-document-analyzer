  /api/units/tree:
    get:
      tags:
      - Unit
      summary: Lấy cây đơn vị tổ chức
      description: "\n      API có 2 chế độ:\n\n      **1. Chế độ Quản lý (`scope='management'`)**\n\
        \      * **Cách dùng:** `GET /api/units/tree?scope=management`\n      * **Mô\
        \ tả:** Trả về cây dựa trên quyền quản lý của người dùng hiện tại.\n     \
        \ * **Lưu ý:** Các tham số lọc khác (rootUnitId, withStaff...) sẽ bị **BỎ\
        \ QUA**.\n\n      **2. Chế độ Mặc định (Không có scope)**\n      * **Cách\
        \ dùng:** `GET /api/units/tree?rootUnitId=...&withStaff=true`\n      * **Mô\
        \ tả:** Lấy toàn bộ cây hoặc lọc theo đơn vị gốc cụ thể.\n      * **Giá trị\
        \ mặc định (nếu không truyền tham số):**\n                - `rootUnitId`:\
        \ **null** (Lấy tất cả đơn vị).\n                - `withStaff`: **false**\
        \ (Không kèm danh sách nhân sự).\n                - `limit`: **null** (Khô\
        ng giới hạn số lượng đơn vị).\n                - `permission`: **null** (Khô\
        ng lọc theo quyền).\n\n      "
      operationId: getUnitTree
      parameters:
      - name: scope
        in: query
        description: "Chế độ xem. Giá trị: 'management' hoặc bỏ trống."
        required: false
        schema:
          type: string
        example: management
      - name: rootUnitId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: null là không có giới hạn
        required: false
        schema:
          type: integer
          format: int32
          description: null là không có giới hạn
      - name: withStaff
        in: query
        description: "Kèm nhân sự, mặc định là không"
        required: false
        schema:
          type: boolean
          default: false
          description: "Kèm nhân sự, mặc định là không"
      - name: permission
        in: query
        description: Quyền để lọc nhân sự
        required: false
        schema:
          type: string
          description: Quyền để lọc nhân sự
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UnitTreeResponse"
