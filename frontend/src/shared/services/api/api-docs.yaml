openapi: 3.1.0
info:
  title: EOffice
  version: v3
servers:
- url: https://eoffice-v3-api.staging.hust.bkfin.tech
  description: Generated server url
security:
- oAuth2: []
tags:
- name: Car
  description: Quản lý xe
- name: OutDocument Admin
  description: Administrative operations for outgoing documents
- name: USB Alias
  description: Quản lý danh sách bí danh USB Token dùng cho ký số
paths:
  /api/password:
    put:
      tags:
      - Change Password
      summary: Đổi mật khẩu
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/outdoc/{documentId}:
    get:
      tags:
      - OutDoc
      summary: Lấy chi tiết văn bản đi
      operationId: getOutDocumentDetail
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DetailDocumentVM"
    put:
      tags:
      - OutDoc
      summary: Cập nhật thông tin văn bản đi
      operationId: updateOutDocument
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: "#/components/schemas/UpdateDocumentRequest"
                mainOriginFile:
                  type: string
                  format: binary
                annexes:
                  type: array
                  items:
                    type: string
                    format: binary
                relatedFileRequests:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - mainOriginFile
      responses:
        "200":
          description: OK
    delete:
      tags:
      - OutDoc
      summary: Xóa văn bản đã bị trả lại
      operationId: deleteRejectedDocument
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/outdoc/usb-aliases/{oldAlias}:
    put:
      tags:
      - USB Alias
      summary: "Cập nhật bí danh USB (Xóa cũ, tạo mới)"
      operationId: update
      parameters:
      - name: oldAlias
        in: path
        description: Bí danh cũ cần sửa
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUSBAliasCommand"
        required: true
      responses:
        "200":
          description: OK
  /api/notification/{id}/read:
    put:
      tags:
      - Notification
      summary: Đánh dấu thông báo đã đọc
      operationId: markAsRead
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/notification/read-all:
    put:
      tags:
      - Notification
      summary: Đánh dấu tất cả thông báo đã đọc
      operationId: markAllAsRead
      responses:
        "200":
          description: OK
  /api/groups/{id}:
    put:
      tags:
      - Group
      summary: Cập nhật khối đơn vị
      operationId: updateGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
        required: true
      responses:
        "200":
          description: OK
    delete:
      tags:
      - Group
      summary: Xóa khối đơn vị
      operationId: deleteGroup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/flow:
    put:
      tags:
      - Flow
      summary: Cập nhật luồng tiếp nhận văn bản cho đơn vị
      operationId: updateFlow
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlowCommand"
        required: true
      responses:
        "200":
          description: OK
  /api/document-type/{id}:
    put:
      tags:
      - Document Type
      summary: Sửa loại VB
      operationId: updateType
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentTypeCommand"
        required: true
      responses:
        "200":
          description: OK
    delete:
      tags:
      - Document Type
      summary: Xóa loại VB
      operationId: deleteType
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: softDelete
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: OK
  /api/document-book/{id}:
    get:
      tags:
      - Document Book
      summary: Lấy chi tiết sổ VB
      operationId: getBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DocumentBookDetailVM"
    put:
      tags:
      - Document Book
      summary: Cập nhật sổ VB
      operationId: updateBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentBookCommand"
        required: true
      responses:
        "200":
          description: OK
    delete:
      tags:
      - Document Book
      summary: Xóa sổ VB
      operationId: deleteBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/document-book/{id}/start-number:
    put:
      tags:
      - Document Book
      summary: Cập nhật số bắt đầu của sổ VB
      operationId: updateStartNumber
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: startNumber
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
  /api/access-control/subjects/{subjectId}:
    put:
      tags:
      - Access Control
      summary: Cập nhật quyền và vai trò cho chức vụ
      operationId: updateSubject
      parameters:
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubjectRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/access-control/roles/{roleId}:
    get:
      tags:
      - Access Control
      summary: Lấy thông tin vai trò theo roleId
      operationId: getRoleById
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RoleVM"
    put:
      tags:
      - Access Control
      summary: Cập nhật vai trò trong hệ thống
      operationId: updateRole
      parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/units/{id}/bsign:
    post:
      tags:
      - Unit
      summary: Tạo tài khoản Bsign cho đơn vị
      operationId: createUnitBsignAccount
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
    delete:
      tags:
      - Unit
      summary: Xóa tài khoản Bsign của đơn vị
      operationId: deleteUnitBsignAccount
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/units/internal/roots:
    post:
      tags:
      - Unit
      summary: Tạo đơn vị nội bộ là gốc của 1 cây
      operationId: createInternalRootUnit
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateInternalRootUnitRequest"
      responses:
        "200":
          description: OK
  /api/units/internal/children:
    post:
      tags:
      - Unit
      summary: Tạo đơn vị con nội bộ
      operationId: createInternalChildUnit
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateInternalChildUnitRequest"
      responses:
        "200":
          description: OK
  /api/units/external:
    get:
      tags:
      - Unit
      summary: "Lấy danh sách các đơn vị ngoài hệ thống, không bao gồm các đơn vị\
        \ đã xóa"
      operationId: getExternalUnits
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedResultExternalUnitVM"
    post:
      tags:
      - Unit
      summary: Tạo đơn vị ngoài hệ thống
      operationId: createExternalUnit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExternalUnitCommand"
        required: true
      responses:
        "200":
          description: OK
  /api/tasks/:
    get:
      tags:
      - Task
      summary: Lấy danh sách công việc
      operationId: getTasks
      parameters:
      - name: name
        in: query
        description: Tên công việc
        required: false
        schema:
          type: string
          description: Tên công việc
      - name: staffRole
        in: query
        required: false
        schema:
          type: string
      - name: accepted
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedResultTaskVM"
    post:
      tags:
      - Task
      summary: Tạo công việc mới
      operationId: createNewTask
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: "#/components/schemas/CreateTaskRequest"
                files:
                  type: array
                  description: Danh sách file mới tải lên
                  items:
                    type: string
                    format: binary
              required:
              - request
            encoding:
              request:
                contentType: application/json
      responses:
        "200":
          description: OK
  /api/subtasks/{taskId}:
    post:
      tags:
      - Subtask
      summary: Tạo đầu công việc mới
      operationId: createSubtask
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubtaskRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/subtasks/{subtaskId}/report:
    post:
      tags:
      - Subtask
      summary: Báo cáo đầu công việc
      operationId: reportSubtask
      parameters:
      - name: subtaskId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: "#/components/schemas/SubtaskReportRequest"
                files:
                  type: array
                  description: Danh sách file báo cáo
                  items:
                    type: string
                    format: binary
              required:
              - request
            encoding:
              request:
                contentType: application/json
      responses:
        "200":
          description: OK
  /api/subtasks/{subtaskId}/reject:
    post:
      tags:
      - Subtask
      summary: Từ chối đầu công việc
      operationId: rejectSubtask
      parameters:
      - name: subtaskId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectSubtaskRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/subtasks/{subtaskId}/complete:
    post:
      tags:
      - Subtask
      summary: Hoàn thành đầu công việc
      operationId: completeSubtask
      parameters:
      - name: subtaskId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/subtasks/{subtaskId}/accept:
    post:
      tags:
      - Subtask
      summary: Xác nhận đầu công việc
      operationId: acceptSubtask
      parameters:
      - name: subtaskId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/sign/usb/complete:
    post:
      tags:
      - usb-signing-controller
      operationId: complete
      parameters:
      - name: correlationId
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
  /api/secretary-config:
    get:
      tags:
      - SecretaryConfig
      summary: Lấy cấu hình thư ký của lãnh đạo
      operationId: getSecretaryConfig
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedResultLeaderSecretariesVM"
    post:
      tags:
      - SecretaryConfig
      summary: Cấu hình thư ký của lãnh đạo (ghi đè)
      operationId: configureSecretary
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureSecretaryRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/secretary-config/append:
    post:
      tags:
      - SecretaryConfig
      summary: Bổ sung thư ký cho lãnh đạo
      operationId: appendSecretary
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureSecretaryRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/records/{recordId}/submit:
    post:
      tags:
      - Record
      summary: Nộp hồ sơ
      operationId: submitRecord
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/records/{recordId}/reject:
    post:
      tags:
      - Record
      summary: Duyệt hồ sơ (trả lại)
      operationId: rejectRecord
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRecordRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/records/{recordId}/documents:
    post:
      tags:
      - Record
      summary: Thêm văn bản cho hồ sơ từ danh sách văn bản đã có trong hệ thống
      operationId: addRecordDocumentExisting
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRecordDocumentCommand"
        required: true
      responses:
        "200":
          description: OK
  /api/records/{recordId}/documents/upload:
    post:
      tags:
      - Record
      summary: Thêm văn bản cho hồ sơ từ file tải lên
      operationId: addRecordDocumentUpload
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: "#/components/schemas/AddRecordDocumentCommand"
                mainFile:
                  type: string
                  format: binary
                  description: File chính
                annexes:
                  type: array
                  description: Danh sách file phụ
                  items:
                    type: string
                    format: binary
              required:
              - mainFile
              - request
            encoding:
              request:
                contentType: application/json
      responses:
        "200":
          description: OK
  /api/records/{recordId}/deny-archiving:
    post:
      tags:
      - Record
      summary: Từ chối lưu trữ hồ sơ
      operationId: denyRecordArchiving
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DenyRecordArchivingRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/records/{recordId}/archive:
    post:
      tags:
      - Record
      summary: Lưu trữ hồ sơ
      operationId: archiveRecord
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/records/{recordId}/accept:
    post:
      tags:
      - Record
      summary: Duyệt hồ sơ (chấp nhận)
      operationId: acceptRecord
      parameters:
      - name: recordId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/records/:
    get:
      tags:
      - Record
      summary: Lấy danh sách hồ sơ
      operationId: getRecordList
      parameters:
      - name: creatorId
        in: query
        description: Id chức vụ người tạo
        required: false
        schema:
          type: string
          description: Id chức vụ người tạo
      - name: unitId
        in: query
        description: Id đơn vị của người tạo hồ sơ
        required: false
        schema:
          type: string
          description: Id đơn vị của người tạo hồ sơ
      - name: text
        in: query
        description: "Tiêu đề hồ sơ, số hiệu hồ sơ hoặc tên đề mục"
        required: false
        schema:
          type: string
          description: "Tiêu đề hồ sơ, số hiệu hồ sơ hoặc tên đề mục"
      - name: isSubmitted
        in: query
        description: Trạng thái nộp
        required: false
        schema:
          type: boolean
          description: Trạng thái nộp
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginatedResultRecordVM"
    post:
      tags:
      - Record
      summary: Tạo hồ sơ
      operationId: createRecord
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordCommand"
        required: true
      responses:
        "200":
          description: OK
  /api/record-categories/{id}/unlock:
    post:
      tags:
      - Record Category
      summary: Mở khóa 1 đề mục hồ sơ
      operationId: unlockCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/record-categories/{id}/lock:
    post:
      tags:
      - Record Category
      summary: Khóa 1 đề mục hồ sơ
      operationId: lockCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/record-categories/unlock-all:
    post:
      tags:
      - Record Category
      summary: Mở khóa toàn bộ danh mục hồ sơ
      operationId: unlockAll
      responses:
        "200":
          description: OK
  /api/record-categories/lock-all:
    post:
      tags:
      - Record Category
      summary: Khóa toàn bộ danh mục hồ sơ
      operationId: lockAll
      responses:
        "200":
          description: OK
  /api/record-categories/file-upload:
    post:
      tags:
      - Record Category
      summary: Tạo đề mục hồ sơ từ file tải lên
      operationId: createRecordCategoryByFileUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File chứa danh sách đề mục hồ sơ cần tạo
              required:
              - file
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "200":
          description: OK
